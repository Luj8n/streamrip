[tool.poetry]
name = "streamrip"
version = "2.2.0"
description = "A fast, all-in-one music downloader for Qobuz, Deezer, Tidal, and SoundCloud"
authors = ["nathom <nathanthomas707@gmail.com>"]
license = "GPL-3.0-only"
readme = "README.md"
homepage = "https://github.com/nathom/streamrip"
repository = "https://github.com/nathom/streamrip"
include = ["streamrip/config.toml"]
keywords = ["hi-res", "free", "music", "download"]
classifiers = [
  "License :: OSI Approved :: GNU General Public License (GPL)",
  "Operating System :: OS Independent",
]
packages = [{ include = "streamrip" }]

[tool.poetry.scripts]
rip = "streamrip.rip:rip"

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
mutagen = "^1.48.1"
tomlkit = "^0.15.2"
pathvalidate = "^3.3.1"
simple-term-menu = { version = "^1.6.6", platform = 'darwin|linux' }
pick = { version = "^2.6.0", platform = 'win32|cygwin' }
windows-curses = { version = "^2.4.2", platform = 'win32|cygwin' }
Pillow = "^13.0.0"
deezer-py = "^1.3.7"
pycryptodomex = "^3.24.2"
appdirs = "^1.4.4"
m3u8 = "^6.0.0"
aiofiles = "^25.1.0"
aiohttp = "^3.14.5"
aiodns = "^4.0.4"
aiolimiter = "^1.3.0"
rich = "^15.0.0"
click = "^8.5.1"
click-help-colors = "^0.9.4"
requests = "^2.34.2"
certifi = { version = ">=2026.10.23", optional = true }

[tool.poetry.urls]
"Bug Reports" = "https://github.com/nathom/streamrip/issues"

[tool.poetry.group.dev.dependencies]
ruff = "^0.17.5"
black = "^26.10.1"
isort = "^9.0.2"
flake8 = "^7.5.0"
pytest = "^9.2.0"
pytest-mock = "^3.17.0"
pytest-asyncio = "^1.5.0"

[tool.pytest.ini_options]
minversion = "9.2"
addopts = "-ra -q"
testpaths = ["tests"]
log_level = "DEBUG"
asyncio_mode = 'auto'
asyncio_default_fixture_loop_scope = 'function'
log_cli = true

[build-system]
requires = ["poetry-core>=2.5.0,<3"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = ["E4", "E7", "E9", "F", "I", "ASYNC", "N", "RUF", "ERA001"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.poetry.extras]
ssl = ["certifi"]
